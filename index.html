<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titan — from-scratch browser engine</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, Segoe UI, Roboto, sans-serif; background: #e9ecef; }
  #chrome { display: flex; flex-direction: column; height: 100vh; }
  #toolbar { display: flex; gap: 6px; align-items: center; padding: 8px; background: #212529; color: #fff; }
  #toolbar button { background: #343a40; color: #fff; border: 1px solid #495057; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #toolbar button:hover { background: #495057; }
  #omnibox { flex: 1; padding: 7px 12px; border-radius: 20px; border: none; outline: none; font-size: 14px; }
  #tabstrip { display: flex; gap: 6px; padding: 6px 8px 0; background: #343a40; }
  .tab { background: #495057; color: #dee2e6; padding: 6px 12px; border-radius: 8px 8px 0 0; font-size: 13px; cursor: pointer; }
  .tab.active { background: #e9ecef; color: #111; }
  #work { display: flex; flex: 1; min-height: 0; }
  #viewwrap { flex: 1; position: relative; min-width: 0; background: #fff; }
  #viewport { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #external-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #000; z-index: 2; }
  #side { width: 360px; background: #f8f9fa; border-left: 1px solid #dee2e6; display: flex; flex-direction: column; min-height: 0; }
  #stats { font-size: 12px; padding: 8px; background: #fff3bf; border-bottom: 1px solid #dee2e6; }
  #devtools { flex: 1; overflow: auto; padding: 8px; font-size: 12px; }
  #devtools h4 { margin: 8px 0 4px; }
  #dom-tree, #style-pane, #console-out { background: #212529; color: #d3f9d8; border-radius: 8px; padding: 8px; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; max-height: 220px; overflow: auto; }
  #console-in { width: 100%; margin-top: 6px; padding: 6px; border-radius: 6px; border: 1px solid #adb5bd; font-family: ui-monospace, monospace; }
  .hint { font-size: 12px; color: #495057; padding: 6px 8px; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="chrome">
  <div id="tabstrip"></div>
  <div id="toolbar">
    <button id="btn-back">←</button>
    <button id="btn-fwd">→</button>
    <button id="btn-reload">⟳</button>
    <button id="btn-newtab">＋</button>
    <input id="omnibox" spellcheck="false" placeholder="titan://welcome or https://…">
    <button id="btn-go">Go</button>
  </div>
  <div id="work">
    <div id="viewwrap"><canvas id="viewport"></canvas><iframe id="external-frame" title="Embedded YouTube player" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div id="side">
      <div id="stats">booting…</div>
      <div id="devtools">
        <h4>Console (Titan JS engine — type JS, Enter to eval)</h4>
        <div id="console-out"></div>
        <input id="console-in" spellcheck="false" placeholder="document.title — eval in page">
        <h4>DOM tree</h4>
        <div id="dom-tree"></div>
        <h4>Page</h4>
        <div id="style-pane"></div>
        <div class="hint">Try: <b>titan://welcome</b> · <b>titan://flex</b> · <b>titan://grid</b> · any https URL · click page elements · scroll with wheel.</div>
      </div>
    </div>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "./dom.js": "./dist/dom.js",
  "./html.js": "./dist/html.js",
  "./css.js": "./dist/css.js",
  "./layout.js": "./dist/layout.js",
  "./paint.js": "./dist/paint.js",
  "./js.js": "./dist/js.js",
  "./bindings.js": "./dist/bindings.js",
  "./browser.js": "./dist/browser.js"
}}
</script>
<!--
  NOTE: this demo loads TypeScript-compiled output from ./dist/*.js.
  Run `npm install && npm run build`, then serve this folder.
  For zero-build dev, the dist/ files are committed equivalents of src/.
-->
<script type="module" src="./dist/main.js"></script>
</body>
</html>
